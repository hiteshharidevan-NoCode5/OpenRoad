apply plugin: 'com.android.application'

android {
    namespace 'org.openroad.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.openroad.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
