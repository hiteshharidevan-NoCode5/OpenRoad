<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenRoad</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #e5e3df; }
    .nav-box {
      position: absolute; top: 12px; left: 12px; right: 12px;
      background: #ffffff; border-radius: 16px; padding: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.22); z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
    }
    .input-row {
      display: flex; align-items: center; gap: 8px;
      background: #f1f3f4; border-radius: 8px; padding: 6px 12px;
    }
    .input-row span { font-size: 14px; font-weight: bold; width: 45px; color: #5f6368; }
    .input-row input { flex: 1; border: none; background: transparent; outline: none; font-size: 15px; color: #202124; }
    .route-btn {
      background: #1a73e8; color: white; border: none; border-radius: 8px;
      padding: 10px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center;
    }
    #turn-banner {
      position: absolute; top: 12px; left: 12px; right: 12px;
      background: #1e8e3e; color: white; border-radius: 16px; padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 25;
      display: none; align-items: center; gap: 14px;
    }
    .turn-icon { font-size: 28px; font-weight: bold; }
    .turn-text { flex: 1; }
    .turn-dist { font-size: 20px; font-weight: 700; }
    .turn-street { font-size: 14px; opacity: 0.9; margin-top: 2px; }
    #route-summary {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: white; border-radius: 20px 20px 0 0;
      padding: 16px 20px; box-shadow: 0 -4px 16px rgba(0,0,0,0.18);
      display: none; z-index: 15;
    }
    .summary-row { display: flex; justify-content: space-between; align-items: center; }
    .summary-time { font-size: 22px; font-weight: 700; color: #1e8e3e; }
    .summary-dist { font-size: 15px; color: #5f6368; }
    .start-nav-btn {
      background: #1a73e8; color: white; border: none; border-radius: 24px;
      padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .stop-nav-btn {
      background: #d93025; color: white; border: none; border-radius: 24px;
      padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="nav-box" id="navCard">
    <div class="input-row">
      <span>From:</span>
      <input type="text" id="startInput" placeholder="Locating..." value="My Location" />
    </div>
    <div class="input-row">
      <span>To:</span>
      <input type="text" id="destInput" placeholder="Enter destination..." />
    </div>
    <button class="route-btn" id="goBtn" onclick="calculateRoute()">Get Directions</button>
  </div>

  <div id="turn-banner">
    <div class="turn-icon" id="turnIcon">^</div>
    <div class="turn-text">
      <div class="turn-dist" id="maneuverDist">-- m</div>
      <div class="turn-street" id="maneuverInstruction">Proceed to route</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="route-summary">
    <div class="summary-row">
      <div>
        <div class="summary-time" id="timeVal">-- min</div>
        <div class="summary-dist" id="distVal">-- km</div>
      </div>
      <button class="start-nav-btn" id="navToggleBtn" onclick="toggleNavigation()">Start</button>
    </div>
  </div>

  <script>
    const DEFAULT_AHM = [72.5310, 23.0300];

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          "osm-tiles": {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "OpenStreetMap contributors"
          }
        },
        layers: [{ id: "osm-layer", type: "raster", source: "osm-tiles", minzoom: 0, maxzoom: 19 }]
      },
      center: DEFAULT_AHM,
      zoom: 13
    });

    let currentPos = DEFAULT_AHM;
    let startMarker = null;
    let endMarker = null;
    let userPuck = null;
    let navSteps = [];
    let isNavigating = false;
    let watchId = null;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        currentPos = [pos.coords.longitude, pos.coords.latitude];
        map.setCenter(currentPos);
      }, null, { enableHighAccuracy: true });
    }

    function speak(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      }
    }

    async function geocode(query) {
      const clean = query.replace(/behind.*/i, "").replace(/near.*/i, "").trim();
      const refPos = currentPos || DEFAULT_AHM;
      const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(clean) +
                  "&lat=" + refPos[1] + "&lon=" + refPos[0] + "&limit=1";
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          return data.features[0].geometry.coordinates;
        }
      } catch (e) {}
      return null;
    }

    async function calculateRoute() {
      const btn = document.getElementById("goBtn");
      btn.innerText = "Finding route...";
      const startText = document.getElementById("startInput").value.trim();
      const destText = document.getElementById("destInput").value.trim();

      if (!destText) {
        alert("Please enter a destination");
        btn.innerText = "Get Directions";
        return;
      }

      let startCoords = (startText.toLowerCase() === "my location") ? currentPos : await geocode(startText);
      let destCoords = await geocode(destText);

      if (!destCoords && !destText.toLowerCase().includes("ahmedabad")) {
        destCoords = await geocode(destText + ", Ahmedabad");
      }

      if (!startCoords) startCoords = DEFAULT_AHM;

      if (!destCoords) {
        alert("Could not locate destination. Please check spelling.");
        btn.innerText = "Get Directions";
        return;
      }

      if (startMarker) startMarker.remove();
      if (endMarker) endMarker.remove();
      startMarker = new maplibregl.Marker({ color: "#1a73e8" }).setLngLat(startCoords).addTo(map);
      endMarker = new maplibregl.Marker({ color: "#ea4335" }).setLngLat(destCoords).addTo(map);

      // radiuses=50;100 restricts destination snapping to wider primary/secondary road networks
      const osrmUrl = "https://router.project-osrm.org/route/v1/driving/" +
                      startCoords[0] + "," + startCoords[1] + ";" +
                      destCoords[0] + "," + destCoords[1] +
                      "?overview=full&geometries=geojson&steps=true&radiuses=50;100&continue_straight=true";

      try {
        const res = await fetch(osrmUrl);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          navSteps = route.legs[0].steps;

          const geojson = { type: "Feature", geometry: route.geometry };
          if (map.getSource("route")) {
            map.getSource("route").setData(geojson);
          } else {
            map.addSource("route", { type: "geojson", data: geojson });
            map.addLayer({
              id: "route",
              type: "line",
              source: "route",
              layout: { "line-join": "round", "line-cap": "round" },
              paint: { "line-color": "#1a73e8", "line-width": 6 }
            });
          }

          const coords = route.geometry.coordinates;
          const bounds = coords.reduce(function(b, c) { return b.extend(c); }, new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 60 });

          const mins = Math.round(route.duration / 60);
          const hrs = Math.floor(mins / 60);
          const remMins = mins % 60;
          document.getElementById("timeVal").innerText = hrs > 0 ? (hrs + " hr " + remMins + " min") : (mins + " min");
          document.getElementById("distVal").innerText = (route.distance / 1000).toFixed(1) + " km";
          document.getElementById("route-summary").style.display = "block";
        } else {
          alert("No direct road route found.");
        }
      } catch (err) {
        alert("Routing server request timed out.");
      }
      btn.innerText = "Get Directions";
    }

    function toggleNavigation() {
      if (!isNavigating) startNavigation();
      else stopNavigation();
    }

    function startNavigation() {
      if (!navSteps || navSteps.length === 0) return;
      isNavigating = true;
      document.getElementById("navCard").style.display = "none";
      document.getElementById("turn-banner").style.display = "flex";
      const btn = document.getElementById("navToggleBtn");
      btn.innerText = "Exit";
      btn.className = "stop-nav-btn";
      map.easeTo({ pitch: 50, zoom: 17 });

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(updateNavigationState, null, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      }
      speak("Starting navigation. Follow the highlighted route.");
    }

    function stopNavigation() {
      isNavigating = false;
      if (watchId) navigator.geolocation.clearWatch(watchId);
      document.getElementById("navCard").style.display = "flex";
      document.getElementById("turn-banner").style.display = "none";
      const btn = document.getElementById("navToggleBtn");
      btn.innerText = "Start";
      btn.className = "start-nav-btn";
      map.easeTo({ pitch: 0, zoom: 14 });
      if (userPuck) userPuck.remove();
      speak("Navigation ended.");
    }

    function getDistance(c1, c2) {
      const R = 6371e3;
      const dLat = (c2[1] - c1[1]) * Math.PI / 180;
      const dLon = (c2[0] - c1[0]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(c1[1] * Math.PI / 180) * Math.cos(c2[1] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateNavigationState(pos) {
      const userCoord = [pos.coords.longitude, pos.coords.latitude];
      const heading = pos.coords.heading || 0;
      map.easeTo({ center: userCoord, bearing: heading, duration: 800 });

      if (!userPuck) {
        userPuck = new maplibregl.Marker({ color: "#00c853" }).setLngLat(userCoord).addTo(map);
      } else {
        userPuck.setLngLat(userCoord);
      }

      if (navSteps.length > 0) {
        const nextStep = navSteps[0];
        const stepCoord = nextStep.maneuver.location;
        const dist = Math.round(getDistance(userCoord, stepCoord));

        document.getElementById("maneuverDist").innerText = dist > 1000 ? (dist/1000).toFixed(1) + " km" : dist + " m";
        let instruction = nextStep.maneuver.instruction || (nextStep.name ? "Continue on " + nextStep.name : "Proceed along route");
        document.getElementById("maneuverInstruction").innerText = instruction;

        const type = nextStep.maneuver.modifier || nextStep.maneuver.type || "";
        if (type.includes("left")) document.getElementById("turnIcon").innerText = "<";
        else if (type.includes("right")) document.getElementById("turnIcon").innerText = ">";
        else document.getElementById("turnIcon").innerText = "^";

        if (dist <= 150 && dist > 30) {
          speak("In " + dist + " meters, " + instruction);
        }
        if (dist < 25) {
          navSteps.shift();
        }
      }
    }
  </script>
</body>
</html>
