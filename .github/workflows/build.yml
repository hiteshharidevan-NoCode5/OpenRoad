name: Build OpenRoad APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Stage Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/OpenRoad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRoad.apk
          path: output/OpenRoad.apk
