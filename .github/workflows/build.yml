name: Build OpenRoad APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Pre-fetch Gradle Distribution
        run: |
          mkdir -p gradle-dist
          curl -L --retry 5 --retry-delay 3 --connect-timeout 30 \
            -o gradle-dist/gradle-8.5-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip
          
          # Generate wrapper targeting the locally downloaded distribution file
          DIST_PATH="file://$(pwd)/gradle-dist/gradle-8.5-bin.zip"
          gradle wrapper --gradle-distribution-url "$DIST_PATH" --no-validate-url
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/OpenRoad.apk

      - name: Upload OpenRoad APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRoad.apk
          path: output/OpenRoad.apk
