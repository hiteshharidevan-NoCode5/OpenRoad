name: Build OpenRoad APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Stage Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/OpenRoad.apk

      - name: Upload OpenRoad APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRoad.apk
          path: output/OpenRoad.apk
